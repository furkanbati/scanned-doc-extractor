services:
  api:
    build: .

    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

    env_file:
      - path: .env
        required: false

    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      TEMPLATES_DIR: /data/templates

    # The rule sets users teach (extractor/templates) outlive the container.
    volumes:
      - templates:/data/templates

    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui

    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"

    environment:
      API_URL: http://api:8000

    depends_on:
      - api

    restart: unless-stopped

  test:
    build: .

    profiles:
      - test

    command: ["python", "-m", "pytest"]

    env_file:
      - path: .env
        required: false

    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}

    volumes:
      - .:/app

  # Local models for the private mode (e5) and e4. Starts empty: the UI offers
  # to download the model. Runs on the CPU; for an NVIDIA GPU add
  # docker-compose.gpu.yml, for other GPUs use Ollama on the host (README).
  ollama:
    image: ollama/ollama

    volumes:
      - ollama:/root/.ollama

    restart: unless-stopped

volumes:
  ollama:
  templates:
