# The modes a user picks from. Each mode runs one engine from
# extractor/engines; the accuracy, speed and cost shown next to it come from
# that engine's `measured` block.
#
# The first available mode in `order` is the default. A mode with a `fallback`
# runs that engine instead while its own engine cannot run here.

order: [accurate, private]

profiles:
  accurate:
    label: High accuracy
    description: >-
      A vision model reads the whole image. The image is sent to OpenAI.
    method: e3

  private:
    label: Private
    description: >-
      Runs on this server; the image never leaves it. A local vision model
      reads the fields and the purchased items. Slower than the cloud.
    method: e5
    # Needs Ollama; without it the mode runs OCR and rules.
    fallback: e2

# Shown greyed out in the advanced panel, so it is clear what can be added.
planned:
  - Google Gemini
  - Anthropic Claude
  - Mistral OCR
  - Azure AI Document Intelligence
  - AWS Textract
